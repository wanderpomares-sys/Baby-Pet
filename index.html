<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#14C8C0">
<meta name="description" content="Baby Pet: vacinas, ração, peso e gastos do seu pet num só lugar.">
<title>Baby Pet</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="assets/favicon-32.png">
<link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Baby Pet">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600&family=Nunito:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css?v=2">
</head>
<body>
<div id="app" aria-live="polite"><p id="carregando" style="padding:40px 24px;text-align:center;font:600 18px system-ui,sans-serif">Carregando o Baby Pet…</p></div>
<div id="sheet-root"></div>
<div id="toast" role="status"></div>
<noscript>O Baby Pet precisa do JavaScript ligado para funcionar.</noscript>
<script>
(function(){
  function msg(t){var a=document.getElementById('app');if(a&&document.getElementById('carregando')){a.innerHTML='<div style="padding:32px 22px;font:16px/1.5 system-ui,sans-serif"><b style="font-size:19px">Não consegui abrir o app</b><p style="margin:10px 0 0">'+t+'</p></div>';}}
  window.addEventListener('error',function(e){
    var t=e.target;
    if(t&&t.tagName==='SCRIPT'){msg('Não encontrei o arquivo <b>'+(t.getAttribute('src')||'').split('?')[0]+'</b> no site. Confira se ele foi enviado ao GitHub com esse nome exato.');}
    else if(e.message){msg('Erro: '+e.message+(e.filename?' ('+e.filename.split('/').pop()+')':''));}
  },true);
  setTimeout(function(){msg('O arquivo <b>app.js</b> não carregou. Confira se ele está no GitHub, na mesma pasta do index.html.');},5000);
})();
</script>
<script src="app.js?v=2"></script>
</body>
</html>
