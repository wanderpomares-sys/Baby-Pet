@media (prefers-color-scheme:dark){
  :root{
    --bg:#06171E; --bg2:#0B2630; --ink:#E8FBF8; --ink2:#9CC6C9;
    --card:rgba(16,46,56,.72); --campo:rgba(10,34,42,.9); --line:rgba(94,234,222,.30);
    --ok:#6EE7A3; --okbg:#0F3A27; --warn:#FFC766; --warnbg:#43300A; --bad:#FF8A8E; --badbg:#4A1618;
    --glow:0 0 0 1px rgba(255,255,255,.06) inset, 0 0 28px rgba(20,200,192,.22), 0 10px 26px rgba(0,0,0,.35);
  }
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{background:var(--bg)}
body{
  margin:0;min-height:100vh;color:var(--ink);font:400 18px/1.55 var(--f-texto);
  background:
    radial-gradient(520px 320px at 100% -40px, rgba(255,201,47,.30), transparent 70%),
    radial-gradient(520px 380px at -10% 18%, rgba(20,200,192,.26), transparent 70%),
    var(--bg);
  background-attachment:fixed;
  padding:env(safe-area-inset-top) 0 0;
}
#app{max-width:520px;margin:0 auto;padding:12px 16px calc(124px + env(safe-area-inset-bottom))}
h1,h2,h3{font-family:var(--f-titulo);font-weight:500;margin:0;letter-spacing:.1px}
h1{font-size:32px;line-height:1.15} h2{font-size:25px;margin:24px 0 12px} h3{font-size:21px}
p{margin:0}
small,.peq{font-size:16px;color:var(--ink2)}
img{max-width:100%}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--pp);outline-offset:2px;border-radius:12px}

/* topo e pets */
.topo{display:flex;align-items:center;gap:10px;padding:4px 0 10px}
.topo img{width:46px;height:46px;border-radius:13px}
.topo b{font:600 27px var(--f-titulo)}
.pets{display:flex;gap:8px;overflow-x:auto;padding:2px 2px 10px;scrollbar-width:none}
.pets::-webkit-scrollbar{display:none}
.chip{flex:none;display:flex;align-items:center;gap:8px;min-height:52px;padding:5px 16px 5px 6px;border-radius:999px;font-size:18px;
  border:1px solid var(--line);background:var(--card);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);font-weight:700}
.chip img{width:38px;height:38px;border-radius:50%;object-fit:cover;background:#C9F5EE}
.chip.on{background:var(--tq);border-color:var(--tq);color:#042E31;box-shadow:0 0 18px rgba(20,200,192,.55)}
.chip.add{padding:5px 16px;color:var(--tq-dk)}
@media (prefers-color-scheme:dark){.chip.add{color:var(--tq)}}

/* vidro */
.glass{background:var(--card);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);
  border:1px solid var(--line);border-radius:26px;box-shadow:var(--glow)}
.card{padding:16px}
.card + .card{margin-top:12px}

/* hero com a Babi */
.hero{display:flex;align-items:flex-end;gap:6px;padding:14px 14px 0 8px;overflow:hidden}
.hero img{width:120px;flex:none;display:block;margin-bottom:-2px}
.bolha{position:relative;margin:0 0 18px;padding:14px 16px;font-size:18px;border-radius:20px 20px 20px 6px;background:var(--campo);
  border:1px solid var(--line);font-weight:600}
.bolha b{font-family:var(--f-titulo);font-weight:500;font-size:22px;display:block;margin-bottom:2px}

/* tiles coloridos */
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin-top:12px}
.tile{display:block;width:100%;text-align:left;border:0;border-radius:24px;padding:16px 14px 14px;min-height:124px;
  box-shadow:0 0 0 1px rgba(255,255,255,.5) inset,0 8px 18px rgba(8,60,66,.14);transition:transform .12s}
.tile:active{transform:scale(.97)}
.tile .v.longo{font-size:clamp(18px,5.6vw,25px)}
.tile .t{font:500 16px var(--f-texto);font-weight:700;opacity:.85;display:flex;align-items:center;gap:6px}
.tile .v{font:500 clamp(22px,7vw,31px)/1.15 var(--f-titulo);margin-top:6px;display:block}
.tile .s{font-size:16px;font-weight:600;opacity:.85;display:block;margin-top:2px}
.t-pk{background:#FF9CC4;color:#58102F} .t-or{background:#FFB26B;color:#552700}
.t-yl{background:#FFD84D;color:#473300} .t-pp{background:#BDB4FF;color:#221A66}

/* botoes: o formato 3D vem do arquivo assets/botao.png (3 partes: ponta, miolo, ponta) */
.btn{--h:66px;--cap:calc(var(--h) * .4833);
  display:inline-flex;align-items:center;justify-content:center;gap:8px;height:var(--h);
  border:0 solid transparent;border-width:0 var(--cap);padding:0 6px;background:none;
  border-image:var(--img-botao) 0 145 0 145 fill / 0 var(--cap) 0 var(--cap) stretch;
  font:500 21px var(--f-titulo);color:#032F33;text-shadow:0 1px 0 rgba(255,255,255,.35);
  transition:transform .12s,filter .12s;min-width:150px}
.btn:active{transform:scale(.96);filter:brightness(.95)}
.btn.sm{--h:56px;font-size:19px;min-width:0}
.btn.full{display:flex;width:100%}
.ghost{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:54px;padding:0 20px;font-size:18px;border-radius:999px;
  border:1px solid var(--line);background:var(--card);font-weight:700}
.ghost.full{display:flex;width:100%}
.ghost.perigo{color:var(--bad);border-color:var(--bad)}
.acoes{display:flex;flex-wrap:wrap;gap:6px 4px;justify-content:center}

/* streak */
.streak{display:flex;align-items:center;gap:12px;margin-top:12px;padding:12px 16px}
.streak .n{font:600 40px var(--f-titulo);color:var(--or)}
.streak b{display:block}

/* listas */
.lista{display:flex;flex-direction:column;gap:10px}
.item{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:12px 14px;border-radius:20px;
  border:1px solid var(--line);background:var(--card);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px)}
.item .ic{flex:none;width:48px;height:48px;border-radius:15px;display:grid;place-items:center;font-size:26px;background:var(--bg2)}
.item .tx{flex:1;min-width:0}
.item .tx b{display:block;overflow-wrap:break-word}
.item .dir{font:500 20px var(--f-titulo);white-space:nowrap}
.tag{flex:none;font-size:15px;font-weight:700;padding:5px 12px;border-radius:999px}
.tag.ok{background:var(--okbg);color:var(--ok)} .tag.warn{background:var(--warnbg);color:var(--warn)}
.tag.bad{background:var(--badbg);color:var(--bad)} .tag.neutro{background:var(--bg2);color:var(--ink2)}
.vazio{text-align:center;padding:26px 16px}
.vazio img{width:130px;margin-bottom:6px}
.vazio p{color:var(--ink2);margin:4px 0 14px;font-size:17px}
.x{flex:none;width:46px;height:46px;border-radius:50%;border:0;background:transparent;color:var(--ink2);font-size:20px}

/* barras */
.barra{height:12px;border-radius:99px;background:var(--bg2);overflow:hidden;margin:8px 0 4px}
.barra i{display:block;height:100%;border-radius:99px;background:var(--tq);box-shadow:0 0 12px rgba(20,200,192,.7)}
.linha{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.linha + .linha{margin-top:6px}
.grande{font:500 42px/1.1 var(--f-titulo)}
.catrow{margin:10px 0}
.catrow .linha span:last-child{font-weight:700}
.mesnav{display:flex;align-items:center;justify-content:space-between;margin:2px 0 10px}
.mesnav button{width:50px;height:50px;border-radius:50%;border:1px solid var(--line);background:var(--card);font-size:18px}
.mesnav b{font:500 23px var(--f-titulo)}
.grafico{width:100%;height:auto;display:block}
.grafico text{font:700 13px var(--f-texto);fill:var(--ink2)}

/* navegação */
.nav{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(10px + env(safe-area-inset-bottom));z-index:20;
  width:min(500px,calc(100% - 20px));display:grid;grid-template-columns:repeat(6,1fr);gap:2px;padding:6px;
  background:var(--campo);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border:1px solid var(--line);border-radius:28px;box-shadow:var(--glow)}
.nav button{display:flex;flex-direction:column;align-items:center;gap:0;border:0;background:none;padding:6px 0 4px;border-radius:22px;min-height:70px}
.nav button span{font-size:25px;line-height:1.2}
.nav button small{font-size:13px;font-weight:700}
.nav button.on{background:var(--tq);color:#032F33;box-shadow:0 0 16px rgba(20,200,192,.6)}
.nav button.on small{color:#032F33}
.ico{width:34px;height:34px;object-fit:contain;display:block;filter:drop-shadow(0 2px 2px rgba(8,60,66,.22));transition:transform .18s}
.nav .ico{width:38px;height:38px;margin:0 auto}
.nav button.on .ico{transform:translateY(-2px) scale(1.14)}
.tile .t .ico{width:42px;height:42px;padding:4px;border-radius:15px;background:rgba(255,255,255,.62);box-shadow:0 1px 0 rgba(255,255,255,.7) inset}
@media (prefers-reduced-motion:reduce){.ico{transition:none}}

/* formulário em folha */
.veu{position:fixed;inset:0;z-index:40;background:rgba(3,30,36,.5);backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px)}
.sheet{position:fixed;left:50%;bottom:0;transform:translateX(-50%);z-index:41;width:min(520px,100%);max-height:92vh;overflow:auto;
  padding:18px 18px calc(20px + env(safe-area-inset-bottom));background:var(--bg);border:1px solid var(--line);
  border-radius:28px 28px 0 0;box-shadow:0 -10px 40px rgba(0,0,0,.25);animation:sobe .22s ease-out}
@keyframes sobe{from{transform:translate(-50%,40px);opacity:.4}to{transform:translate(-50%,0);opacity:1}}
.sheet h2{margin:0 0 12px}
.fld{display:block;margin-bottom:12px}
.fld span{display:block;font-size:17px;font-weight:700;margin-bottom:4px;color:var(--ink2)}
.fld input,.fld select{width:100%;min-height:58px;padding:0 14px;border-radius:16px;border:1px solid var(--line);background:var(--campo);color:var(--ink);font:inherit;font-size:19px}
.fld input[type=file]{padding:12px 14px;height:auto}
.dupla{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px}
.dupla .fld{min-width:0}
.fld input,.fld select{min-width:0;max-width:100%}
.fld input[type=date]{-webkit-appearance:none;appearance:none;padding-right:8px}
.sheet .rodape{display:flex;flex-direction:column;align-items:center;gap:8px;margin-top:8px}

#toast{position:fixed;left:50%;top:calc(14px + env(safe-area-inset-top));transform:translate(-50%,-90px);z-index:60;max-width:calc(100% - 32px);
  padding:14px 20px;border-radius:22px;text-align:center;line-height:1.35;background:var(--ink);color:var(--bg);font-weight:700;font-size:18px;transition:transform .25s}
#toast.on{transform:translate(-50%,0)}

/* boas-vindas */
.boas{text-align:center;padding:26px 8px}
.boas img{width:min(210px,52vw);display:block;margin:0 auto 6px}
.boas p{color:var(--ink2);margin:10px auto 22px;max-width:28ch;font-size:20px}
.boas h1{font-size:36px}

.parceiro{margin-top:12px;border-color:#FFC92F;border-width:1.5px}
.parceiro p{margin:2px 0 0}
.par-info{display:flex;align-items:center;gap:12px;margin:14px 0 10px}
.par-info small{display:block}
.par-logo{flex:none;width:50px;height:50px;border-radius:16px;background:var(--pp);color:#fff;display:grid;place-items:center;font:600 26px var(--f-titulo)}
.oferta{background:#FFE98A;color:#473300;border-radius:14px;padding:10px 12px;font-weight:700;margin-bottom:14px}
.porque{border:0;background:none;color:var(--ink2);text-decoration:underline;font-size:15px;min-height:40px;padding:0 4px}
.demo{display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px;margin:0 0 10px;padding:10px 14px;border-radius:18px;background:#FFE98A;color:#473300;font-size:16px;font-weight:700}
.demo span{flex:1;min-width:150px}
.demo button{min-height:40px;padding:0 14px;border-radius:999px;border:1px solid rgba(71,51,0,.35);background:rgba(255,255,255,.65);font-weight:700;color:#473300}
.bib-chips{display:flex;gap:8px;overflow-x:auto;padding:2px 2px 12px;scrollbar-width:none}
.bib-chips::-webkit-scrollbar{display:none}
.bib-hero{display:flex;gap:14px;align-items:center;padding:16px}
.bib-emoji{font-size:54px;line-height:1;flex:none}
.bib-hero p{margin:4px 0 8px}
.aviso-bib{border-color:#FFC92F;border-width:1.5px;font-size:16px}
.alerta-bib{background:var(--badbg);border-color:var(--bad)}
.alerta-bib h3{color:var(--bad)}
.alerta-bib ul{margin:8px 0 0;padding-left:20px}
.alerta-bib li{margin:6px 0}
details.bib{margin-top:10px;border-radius:20px;border:1px solid var(--line);background:var(--card);padding:0 16px}
details.bib summary{min-height:58px;display:flex;align-items:center;justify-content:space-between;font:500 20px var(--f-titulo);cursor:pointer;list-style:none}
details.bib summary::-webkit-details-marker{display:none}
details.bib summary::after{content:'+';font-size:28px;color:var(--tq-dk);margin-left:10px}
details.bib[open] summary::after{content:'\2013'}
details.bib ul{margin:0 0 14px;padding-left:20px}
details.bib li{margin:8px 0}
.toxi{display:flex;gap:12px;align-items:flex-start;padding:12px 0;border-top:1px solid var(--line)}
.toxi:first-of-type{border-top:0}
.toxi .tag{margin-top:2px;white-space:nowrap}
.res{padding:12px 14px;border-radius:16px;margin-top:12px;font-weight:700}
.res.grave{background:var(--badbg);color:var(--bad)}
.res.mod{background:var(--warnbg);color:var(--warn)}
.res.neutro{background:var(--bg2);color:var(--ink)}
.res small{display:block;font-weight:600;margin-top:4px}
.fontes li{margin:8px 0}
.fontes a{color:var(--tq-dk);word-break:break-word}
@media (prefers-color-scheme:dark){.fontes a{color:var(--tq)}}
.item .ic .ico{width:36px;height:36px}
.link-wiki{display:inline-block;margin-top:8px;color:var(--tq-dk);font-weight:700;text-decoration:underline;min-height:40px;line-height:40px}
@media (prefers-color-scheme:dark){.link-wiki{color:var(--tq)}}
.wiki-card{display:flex;gap:12px;align-items:flex-start}
.wiki-card img{width:76px;height:76px;object-fit:cover;border-radius:14px;flex:none;background:var(--bg2)}
.wiki-card p{margin:4px 0 0}
.confete{position:fixed;top:-14px;left:var(--x);width:9px;height:14px;border-radius:3px;z-index:99;pointer-events:none;animation:cai var(--d) ease-in forwards}
@keyframes cai{to{transform:translate(var(--dx),105vh) rotate(var(--r))}}
@media (prefers-reduced-motion:reduce){.sheet{animation:none}.btn,.tile{transition:none}}

<script>
const BIB_PADRAO = {"versao":3,"atualizado":"2026-10-03","aviso":"Conteúdo informativo e em revisão veterinária. Não substitui a consulta ao veterinário. Em emergência, procure um veterinário.","nota":"Dados de expectativa de vida e gestação de cães, gatos, hamsters, chinchilas e furões, o peso da chinchila e os cuidados de ambiente do furão vêm de referência geral ou de fontes comerciais e ainda aguardam revisão veterinária. As fontes variam em alguns pontos, como a expectativa de vida e a temperatura ideal da chinchila, as proporções da dieta do jabuti e os legumes permitidos ao porquinho-da-índia.","fontes":[{"nome":"ASPCA: alimentos que não devem ser dados aos pets","url":"https://www.aspca.org/pet-care/animal-poison-control/people-foods-avoid-feeding-your-pets"},{"nome":"World Parrot Trust: alimentos perigosos para papagaios","url":"https://parrots.org/wp-content/uploads/2025/02/dangerous_foods_for_parrots.pdf"},{"nome":"Universidade de Illinois (Medicina Veterinária): intoxicação em aves","url":"https://vetmed.illinois.edu/?p=44461"},{"nome":"Petz: espécies de pássaros e expectativa de vida","url":"https://www.petz.com.br/blog/curiosidades/especies-de-passaros-confira-aqui-as-mais-populares/"},{"nome":"Anais da UEG: características do papagaio-verdadeiro","url":"https://www.anais.ueg.br/index.php/sezus/article/view/9385/6752"},{"nome":"PangoVet: alimentos nocivos para coelhos","url":"https://petcorner.pangovet.com/pet-health-wellness/rabbits/foods-harmful-to-rabbits"},{"nome":"Itatiaia: o que considerar antes de adotar uma chinchila","url":"https://www.itatiaia.com.br/pets-e-animais/o-que-considerar-antes-de-adotar-uma-chinchila-pet-exige-compromisso-de-longo-prazo/"},{"nome":"Petz: como cuidar de chinchila","url":"https://www.petz.com.br/blog/como-cuidar-de-chinchila/"},{"nome":"Petz: tudo sobre chinchila","url":"https://www.petz.com.br/blog/tudo-sobre-chinchila/amp/"},{"nome":"Texas A&M (Medicina Veterinária): chinchilas não precisam das vacinas de cães e gatos","url":"https://stories.tamu.edu/?p=292118"},{"nome":"Animal Humane Society: cuidados com chinchilas","url":"https://animalhumanesociety.org/adoption/chinchilla-care"},{"nome":"Mans, C. (Univ. de Wisconsin): chinchilas, técnicas clínicas e doenças comuns","url":"https://vin.com/doc/?id=9768913"},{"nome":"Petlove: vacinação em animais exóticos","url":"https://www.petlove.com.br/dicas/vacinacao-em-animais-exoticos"},{"nome":"Itatiaia: ração de coelho não serve para porquinho-da-índia","url":"https://www.itatiaia.com.br/pets-e-animais/nada-de-dar-racao-de-coelho-para-porquinho-da-india-saiba-por-que/"},{"nome":"Petz: quanto tempo vive um porquinho-da-índia","url":"https://www.petz.com.br/blog/curiosidades/quantos-anos-vive-um-porquinho-da-india"},{"nome":"Petz: quanto tempo vive um furão","url":"https://www.petz.com.br/blog/quanto-tempo-vive-um-furao/amp/"},{"nome":"Petz: tudo sobre jabuti","url":"https://www.petz.com.br/blog/?p=2442657"},{"nome":"Agora RN: criar um jabuti em casa","url":"https://agorarn.com.br/ultimas/tudo-que-voce-precisa-saber-para-criar-um-jabuti-no-quintal-de-sua-casa/"}],"especies":[{"id":"cao","nome":"Cachorro","emoji":"🐶","pet":["cao"],"palavras":[],"status":"rascunho","resumo":"Companheiro social que precisa de rotina, exercício diário e acompanhamento veterinário regular.","secoes":[{"titulo":"Vida e porte","itens":["A expectativa média é de 10 a 13 anos. Raças pequenas costumam viver mais que as gigantes.","O peso adulto vai de 2 kg a mais de 50 kg, conforme a raça. Peça ao veterinário a faixa ideal do seu cão e acompanhe pela aba Peso."]},{"titulo":"Alimentação","itens":["A base é uma ração completa para a fase da vida: filhote, adulto ou idoso. Água fresca sempre disponível.","Filhotes comem de 3 a 4 vezes por dia. Adultos, em geral, 2 vezes.","Petiscos não devem passar de cerca de 10% das calorias do dia.","Ossos crus ou cozidos podem causar engasgo, lesões e infecções. Evite.","Ajuste a porção ao peso e à atividade, e use a aba Comida para acompanhar."]},{"titulo":"Saúde e vacinas","itens":["As vacinas essenciais são a polivalente (V8 ou V10) e a antirrábica, com reforço anual na maioria dos protocolos. O calendário exato é definido pelo veterinário.","Vermifugação e controle de pulgas e carrapatos devem ser regulares, conforme a orientação veterinária.","Consulta de rotina ao menos uma vez por ano. Cães idosos precisam de mais acompanhamento.","Escovar os dentes e limpar os ouvidos ajuda a prevenir problemas."]},{"titulo":"Ambiente e rotina","itens":["Passeios diários. A duração depende da raça, da idade e da saúde.","Nunca deixe o cão dentro do carro e evite passeios nas horas mais quentes: o asfalto queima as patas.","Brincadeiras e socialização evitam tédio e comportamentos destrutivos."]},{"titulo":"Reprodução","itens":["A gestação dura cerca de 63 dias após a ovulação, podendo variar alguns dias.","Em geral a fêmea entra no cio cerca de duas vezes ao ano, mas varia com a raça e o porte.","Na gestação, faça acompanhamento veterinário e ajuste a dieta. Não dê remédios sem orientação.","Converse com o veterinário sobre castração, seus benefícios e o melhor momento."]},{"titulo":"Curiosidades","itens":["O olfato do cão é muito mais sensível que o nosso. Ele conhece o mundo pelo cheiro."]}],"toxicos":[{"nome":"Chocolate","gravidade":"grave","obs":"Tem teobromina e cafeína. Quanto mais escuro o chocolate, maior o risco. Causa vômito, tremores, convulsões e arritmia.","apelidos":["cacau","brigadeiro","bombom","achocolatado","nutella","chocolate"]},{"nome":"Uvas e passas","gravidade":"grave","obs":"Podem causar insuficiência renal, mesmo em pequena quantidade.","apelidos":["uva","passa","uva passa"]},{"nome":"Cebola, alho e cebolinha","gravidade":"grave","obs":"Podem destruir os glóbulos vermelhos e causar anemia. Atenção a temperos e comida caseira.","apelidos":["cebola","alho","cebolinha","alho-poro","tempero"]},{"nome":"Xilitol","gravidade":"grave","obs":"Adoçante em gomas, balas, pasta de dente e produtos sem açúcar. Causa queda do açúcar no sangue e pode lesar o fígado.","apelidos":["adocante","goma de mascar","chiclete","bala sem acucar","pasta de dente"]},{"nome":"Álcool","gravidade":"grave","obs":"Mesmo pouca quantidade pode intoxicar. Procure o veterinário na hora.","apelidos":["cerveja","vinho","cachaca","bebida alcoolica","vodka"]},{"nome":"Massa de pão crua","gravidade":"grave","obs":"A massa cresce e fermenta no estômago e produz álcool.","apelidos":["massa de pao","massa crua","fermento","massa de pizza"]},{"nome":"Café e cafeína","gravidade":"grave","obs":"A cafeína causa agitação, tremores e problemas no coração.","apelidos":["cafe","cafeina","energetico","cha preto","refrigerante de cola","guarana"]},{"nome":"Remédios de uso humano","gravidade":"grave","obs":"Paracetamol, ibuprofeno e outros podem ser fatais. Nunca medique sem orientação.","apelidos":["paracetamol","ibuprofeno","dipirona","remedio","analgesico","anti-inflamatorio"]},{"nome":"Macadâmia","gravidade":"moderada","obs":"Causa fraqueza, vômito, tremores e febre.","apelidos":["macadamia","noz macadamia"]},{"nome":"Abacate","gravidade":"moderada","obs":"Pode causar vômito e diarreia, e o caroço oferece risco de engasgo e obstrução.","apelidos":["avocado","guacamole"]},{"nome":"Sal e salgadinhos","gravidade":"moderada","obs":"Excesso de sal causa sede excessiva, vômito e, em casos graves, convulsões.","apelidos":["sal","salgadinho","batata frita","pipoca salgada","biscoito"]},{"nome":"Ossos cozidos ou crus","gravidade":"moderada","obs":"Podem lascar, engasgar e perfurar o intestino, e os crus carregam bactérias.","apelidos":["osso","ossos","costela"]},{"nome":"Leite e laticínios","gravidade":"leve","obs":"Cães têm pouca lactase. O leite costuma causar diarreia e desconforto.","apelidos":["leite","queijo","iogurte","laticinio","sorvete"]}],"alertas":["Vômitos ou diarreia repetidos, ou com sangue","Apatia forte ou recusa de comida por mais de 24 horas","Barriga inchada e dura, ou tentativas de vomitar sem sucesso","Convulsão, tremores ou desmaio","Dificuldade para respirar ou gengivas pálidas ou azuladas","Suspeita de que comeu algo tóxico: ligue para o veterinário na hora e não provoque vômito sem orientação"],"vacinas":{"modo":"rotina","nota":"O calendário exato (polivalente, antirrábica e vermífugo) é definido pelo veterinário."}},{"id":"gato","nome":"Gato","emoji":"🐱","pet":["gato"],"palavras":[],"status":"rascunho","resumo":"Independente, mas precisa de rotina, ambiente enriquecido e acompanhamento veterinário.","secoes":[{"titulo":"Vida e porte","itens":["Gatos que vivem dentro de casa costumam viver de 12 a 18 anos.","O peso adulto fica, na maioria, entre 3 e 5 kg. Peça ao veterinário a faixa ideal do seu gato e acompanhe pela aba Peso."]},{"titulo":"Alimentação","itens":["Gatos são carnívoros. A base deve ser ração completa própria para gatos. Não substitua por ração de cachorro.","Deixe água fresca sempre. Fontes de água estimulam o gato a beber mais.","A obesidade é comum. Controle a porção e acompanhe o peso.","Leite de vaca costuma causar diarreia."]},{"titulo":"Saúde e vacinas","itens":["As vacinas comuns são a polivalente (V3, V4 ou V5) e a antirrábica, com reforços definidos pelo veterinário.","Vermifugação e controle de pulgas devem ser regulares.","Converse com o veterinário sobre castração, que ajuda a reduzir fugas, marcação de território e alguns problemas de saúde.","Gatos escondem a dor. Pequenas mudanças de comportamento merecem atenção."]},{"titulo":"Ambiente e rotina","itens":["Limpe a caixa de areia todos os dias. A regra comum é uma caixa por gato, mais uma extra.","Arranhadores, esconderijos e lugares altos reduzem o estresse.","Telas de proteção em janelas e sacadas evitam quedas."]},{"titulo":"Reprodução","itens":["A gestação dura cerca de 63 a 67 dias.","O cio é sazonal e se repete várias vezes se não houver cruzamento. Miados altos e comportamento muito carinhoso são sinais comuns.","Converse com o veterinário sobre castração antes de pensar em cruzar."]}],"toxicos":[{"nome":"Lírios","gravidade":"grave","obs":"Lírios e plantas parecidas são muito tóxicos para gatos, até em pouca quantidade (pólen, folhas ou água do vaso). Podem causar insuficiência renal.","apelidos":["lirio","lily","flor","planta"]},{"nome":"Cebola, alho e cebolinha","gravidade":"grave","obs":"Podem destruir os glóbulos vermelhos e causar anemia.","apelidos":["cebola","alho","cebolinha","tempero"]},{"nome":"Chocolate","gravidade":"grave","obs":"Tem teobromina e cafeína. Causa vômito, tremores e problemas no coração.","apelidos":["cacau","brigadeiro","bombom","achocolatado","nutella","chocolate"]},{"nome":"Uvas e passas","gravidade":"grave","obs":"Podem causar problemas nos rins. Por precaução, evite.","apelidos":["uva","passa","uva passa"]},{"nome":"Café e cafeína","gravidade":"grave","obs":"A cafeína causa agitação, tremores e problemas no coração.","apelidos":["cafe","cafeina","energetico","cha preto","refrigerante de cola","guarana"]},{"nome":"Álcool","gravidade":"grave","obs":"Mesmo pouca quantidade pode intoxicar. Procure o veterinário na hora.","apelidos":["cerveja","vinho","cachaca","bebida alcoolica","vodka"]},{"nome":"Xilitol","gravidade":"grave","obs":"Adoçante em gomas, balas e produtos sem açúcar. Evite totalmente.","apelidos":["adocante","goma de mascar","chiclete","bala sem acucar","pasta de dente"]},{"nome":"Remédios de uso humano","gravidade":"grave","obs":"Paracetamol e ibuprofeno são perigosos, e o paracetamol é muito tóxico para gatos. Nunca medique sem orientação.","apelidos":["paracetamol","ibuprofeno","dipirona","remedio","analgesico","anti-inflamatorio"]},{"nome":"Sal e salgadinhos","gravidade":"moderada","obs":"Excesso de sal causa sede excessiva e pode intoxicar.","apelidos":["sal","salgadinho","batata frita","pipoca salgada","biscoito"]},{"nome":"Leite e laticínios","gravidade":"leve","obs":"Gatos têm pouca lactase. O leite costuma causar diarreia e desconforto.","apelidos":["leite","queijo","iogurte","laticinio","sorvete"]}],"alertas":["Tentar urinar sem sucesso, ir e voltar da caixa de areia ou miar de dor: é urgência, principalmente em machos","Vômitos repetidos ou recusa de comida por mais de 24 horas","Respirar de boca aberta ou ofegante","Convulsão, tremores ou desmaio","Suspeita de contato com lírio, remédio humano ou veneno"],"vacinas":{"modo":"rotina","nota":"O calendário exato (polivalente, antirrábica e vermífugo) é definido pelo veterinário."}},{"id":"papagaio","nome":"Papagaio-verdadeiro","emoji":"🦜","pet":[],"palavras":["papagaio","amazona","louro","curica"],"status":"rascunho","resumo":"Ave inteligente, social e de vida longa. Exige muito tempo de interação e atenção às regras legais.","secoes":[{"titulo":"Vida e porte","itens":["Vive de 40 a 60 anos ou mais. Com cuidados inadequados, a vida pode ser muito mais curta.","Mede cerca de 35 a 37 cm e pesa em torno de 400 g."]},{"titulo":"Alimentação","itens":["A base é ração extrusada (pellets) própria para papagaios, com frutas, legumes e folhas frescos.","Sementes e castanhas engordam e desequilibram a dieta. Use como petisco, em pouca quantidade.","Tire as sementes e os caroços de maçã, pêra, cereja, pêssego e ameixa antes de oferecer a fruta.","Retire do comedouro as frutas e os legumes que sobrarem, para evitar mofo.","Água fresca todos os dias."]},{"titulo":"Saúde e vacinas","itens":["A vacinação de aves depende da espécie e de surtos na região. Confirme com um veterinário de aves antes de aplicar qualquer vacina.","Aves escondem a doença. Penas eriçadas, apatia e fezes diferentes pedem consulta.","Faça consulta com veterinário de aves ou de animais silvestres ao menos uma vez por ano.","Peça orientação ao veterinário sobre unhas, bico e asas. Não corte por conta própria."]},{"titulo":"Ambiente e rotina","itens":["Gaiola ou viveiro grande, com poleiros de diâmetros variados e brinquedos para roer.","Precisa de interação diária e tempo fora da gaiola. Sem isso, pode gritar muito ou arrancar as próprias penas.","Evite correntes de ar e a cozinha. Nunca use panelas antiaderentes (Teflon), aerossóis, velas perfumadas, incenso ou cigarro perto da ave."]},{"titulo":"Reprodução","itens":["A fêmea põe de 3 a 5 ovos, com incubação de 24 a 29 dias.","Os filhotes saem do ninho cerca de 60 dias após o nascimento.","A reprodução em cativeiro exige criadouro autorizado."]},{"titulo":"Legislação","itens":["O papagaio-verdadeiro é fauna nativa protegida. Só é legal ter um animal vindo de criadouro autorizado pelo Ibama, com documentação.","Comprar ou manter ave sem registro é crime e pode gerar punições.","Confirme as regras atuais no Ibama ou no órgão ambiental do seu estado."]}],"toxicos":[{"nome":"Abacate","gravidade":"grave","obs":"Contém persina, que pode causar problemas no coração e levar à morte. Vale para fruta, casca, caroço e folhas.","apelidos":["guacamole","avocado"]},{"nome":"Chocolate","gravidade":"grave","obs":"Tem teobromina e cafeína. Causa vômito, tremores, convulsões e pode matar, mesmo em pouca quantidade.","apelidos":["cacau","brigadeiro","bombom","achocolatado","nutella"]},{"nome":"Café, chá e outras bebidas com cafeína","gravidade":"grave","obs":"A cafeína acelera o coração e pode causar arritmia e parada cardíaca.","apelidos":["cafeina","chimarrao","cha mate","cha preto","energetico","refrigerante de cola","guarana"]},{"nome":"Cebola, alho e cebolinha","gravidade":"grave","obs":"Podem destruir os glóbulos vermelhos e causar anemia.","apelidos":["cebola","alho","cebolinha","alho-poro","echalota"]},{"nome":"Álcool","gravidade":"grave","obs":"A ave fica intoxicada com quantidades mínimas, com risco de morte.","apelidos":["cerveja","vinho","cachaca","bebida alcoolica","vodka"]},{"nome":"Sementes e caroços de maçã, pêra, cereja, pêssego e ameixa","gravidade":"grave","obs":"Contêm um composto que vira cianeto. Tire sementes e caroços antes de oferecer a fruta; a polpa é segura.","apelidos":["semente de maca","caroco","caroço de pessego","caroco de ameixa","caroco de cereja"]},{"nome":"Xilitol","gravidade":"grave","obs":"Adoçante presente em gomas, balas e produtos sem açúcar. Evite totalmente.","apelidos":["adocante","goma de mascar","chiclete","bala sem acucar"]},{"nome":"Panela antiaderente (Teflon) e aerossóis","gravidade":"grave","obs":"Não é comida, mas os gases de panela antiaderente superaquecida, aerossol, vela perfumada, incenso e fumaça de cigarro podem matar aves em minutos.","apelidos":["teflon","antiaderente","aerossol","spray","incenso","vela","cigarro","fumaca"],"naoComida":true},{"nome":"Alimentos mofados e amendoim velho","gravidade":"grave","obs":"O mofo produz toxinas que atacam o fígado e podem ser fatais.","apelidos":["mofo","bolor","amendoim","comida estragada"]},{"nome":"Sal e salgadinhos","gravidade":"moderada","obs":"Excesso de sal desidrata e faz mal aos rins. Ofereça sempre comida sem sal.","apelidos":["sal","salgadinho","batata frita","pipoca salgada","biscoito"]},{"nome":"Frituras e comidas gordurosas","gravidade":"moderada","obs":"Engordam e sobrecarregam o fígado.","apelidos":["frito","fritura","pastel","gordura","bacon"]}],"alertas":["Respirar de bico aberto ou balançando a cauda a cada respiração","Ficar parada no fundo da gaiola, com as penas muito eriçadas","Parar de comer por mais de um dia","Fezes aquosas, escuras ou com sangue por mais de um dia","Sangramento, convulsão ou desmaio","Contato com fumaça de panela antiaderente: leve a ave ao ar livre e procure um veterinário na hora","Suspeita de que comeu algo tóxico"],"vacinas":{"modo":"consultar","nota":"A vacinação de aves depende da espécie e de surtos na região. Confirme com um veterinário de aves antes de aplicar qualquer vacina."}},{"id":"calopsita","nome":"Calopsita","emoji":"🐦","pet":[],"palavras":["calopsita","cockatiel"],"status":"rascunho","resumo":"Ave dócil e sociável, ótima para quem tem tempo para dar companhia todo dia.","secoes":[{"titulo":"Vida e porte","itens":["Vive cerca de 15 anos, com er.","Procure um veterinário de animais exóticos."]},{"titulo":"Ambiente e rotina","itens":["O hamster-sírio é solitário. Mantenha um por gaiola para evitar brigas.","Ofereça roda de tamanho adequado, sem grades que machuquem as patas. Ele é mais ativo à noite.","Prefira forração de papel ou de madeira sem cheiro forte. Evite fibras de algodão, que podem enroscar."]},{"titulo":"Reprodução","itens":["A gestação é muito curta, cerca de 16 dias no hamster-sírio.","A fêmea pode atacar o macho. Converse com um veterinário antes de juntar um casal."]}],"toxicos":[{"nome":"Chocolate","gravidade":"grave","obs":"A teobromina é tóxica, e o hamster é pequeno, então uma quantidade mínima já é muito.","apelidos":["cacau","brigadeiro","bombom","achocolatado","chocolate"]},{"nome":"Feijão cru","gravidade":"grave","obs":"O feijão cru é tóxico para hamsters.","apelidos":["feijao","feijao cru","feijao vermelho"]},{"nome":"Folhas de tomate","gravidade":"grave","obs":"As folhas do tomateiro são tóxicas. O fruto maduro, em pouca quantidade, costuma ser aceito.","apelidos":["tomate","folha de tomate"]},{"nome":"Cebola e alho","gravidade":"moderada","obs":"Podem causar anemia. Por precaução, evite.","apelidos":["cebola","alho","cebolinha"]},{"nome":"Amêndoas","gravidade":"moderada","obs":"Amêndoas são consideradas nocivas para hamsters. Evite.","apelidos":["amendoa","amendoas"]},{"nome":"Açúcar e doces","gravidade":"moderada","obs":"Engordam e favorecem a diabetes, principalmente nas raças anãs.","apelidos":["acucar","doce","bala","bolo","biscoito","mel"]},{"nome":"Amendoim salgado","gravidade":"moderada","obs":"É gorduroso demais, e o sal favorece a desidratação.","apelidos":["amendoim","salgadinho"]},{"nome":"Alimentos pegajosos","gravidade":"leve","obs":"Pasta de amendoim e pão fresco podem grudar nas bochechas.","apelidos":["pasta de amendoim","pao","pao fresco"]}],"alertas":["Diarreia ou traseiro molhado (a chamada cauda molhada): é urgência","Não comer nem beber por mais de um dia","Perda de peso rápida","Caroço, inchaço ou ferida que não melhora","Respiração difícil ou chiado"],"vacinas":{"modo":"nenhuma","nota":"Hamsters de estimação não costumam precisar de vacinas ou vermífugos de rotina. Use esta aba para consultas, exames e tratamentos que o veterinário indicar."}},{"id":"chinchila","nome":"Chinchila","emoji":"🐭","pet":[],"palavras":["chinchila"],"status":"rascunho","resumo":"Roedor delicado e de vida longa. O maior risco é o calor, e ela nunca pode tomar banho com água.","secoes":[{"titulo":"Vida e porte","itens":["Costuma viver de 10 a 15 anos em cativeiro. Algumas fontes citam até 20 anos com ótimos cuidados. É um compromisso de longo prazo.","O adulto pesa em torno de 400 a 600 g, e as fêmeas costumam ser um pouco maiores."]},{"titulo":"Alimentação","itens":["A base é feno de boa qualidade, sempre disponível e em grande quantidade, mais uma ração extrusada própria para chinchilas.","Escolha ração sem grãos à vista, como milho, ervilha e amendoim, que são muito gordurosos.","O sistema digestivo é delicado. Frutas, verduras e petiscos só em pedacinhos e raramente.","Água fresca sempre, de preferência em bebedouro de bico.","Mude a alimentação aos poucos."]},{"titulo":"Saúde","itens":["Chinchilas de estimação não precisam de vacinas de rotina.","Leve a um veterinário que conheça chinchilas nas duas primeiras semanas depois de adotar e, depois, uma vez por ano, com exame de fezes para parasitas.","Faça uma checagem semanal e anote mudanças em apetite, fezes, peso, pelos e olhos. A aba Peso ajuda.","Nunca dê remédio humano nem antibiótico sem orientação. Penicilina e outros antibióticos podem ser fatais para chinchilas.","Os dentes crescem a vida toda. Feno em abundância e blocos de roer ajudam no desgaste.","O pó de banho sujo pode favorecer conjuntivite. Troque com frequência.","Quando assustada ou segurada com força, ela solta tufos de pelo. O pelo volta, mas leva meses."]},{"titulo":"Ambiente e rotina","itens":["O ideal é manter o ambiente abaixo de 24 °C. Acima de 27 °C há risco de golpe de calor. A umidade deve ficar abaixo de 60%, e melhor ainda abaixo de 50%.","São sociáveis e costumam viver melhor acompanhadas. Peça orientação ao veterinário antes de juntar animais.","Mantenha a chinchila longe de sol direto, de lugares úmidos e de correntes de ar.","Gaiola grande, alta e com vários andares e prateleiras, porque ela gosta de escalar. Casas de hamster ou coelho não servem.","Limpe a gaiola todos os dias.","É mais ativa ao entardecer e à noite. Interromper o sono do dia causa estresse.","Ofereça roda de superfície lisa, sem grades, e madeira própria para roedores para roer."]},{"titulo":"Banho de pó","itens":["A chinchila nunca toma banho com água. O pelo denso demora a secar, e a umidade favorece fungos e infecções.","A higiene é feita a seco, com pó de banho específico (areia mineral) numa banheira, onde ela rola à vontade.","Ofereça o banho de pó ao menos uma vez por semana e retire a banheira depois."]},{"titulo":"Reprodução","itens":["A gestação é longa para um roedor, cerca de 111 dias (de 105 a 115).","Em geral nascem de 1 a 3 filhotes, que já vêm com pelos e olhos abertos.","Converse com um veterinário de exóticos antes de pensar em reproduzir."]},{"titulo":"Legislação","itens":["Pelas normas do Ibama, a chinchila é considerada animal doméstico ou de estimação.","Compre de criadouro regularizado e confirme as regras atuais no órgão ambiental."]}],"toxicos":[{"nome":"Banho molhado","gravidade":"grave","obs":"Não é comida, mas molhar a chinchila é perigoso. O pelo demora a secar e a umidade favorece fungos e infecções.","apelidos":["banho","molhar","chuveiro","agua no pelo","lavar"],"naoComida":true},{"nome":"Calor acima de 27 °C","gravidade":"grave","obs":"Não é comida, mas o calor é o maior risco. Acima de 27 °C pode causar golpe de calor. Mantenha em local fresco, seco e ventilado.","apelidos":["calor","temperatura","sol","verao","carro"],"naoComida":true},{"nome":"Antibióticos e remédios humanos","gravidade":"grave","obs":"Penicilina e outros antibióticos humanos podem ser fatais para chinchilas. Só medique com orientação de veterinário que conheça a espécie.","apelidos":["antibiotico","penicilina","amoxicilina","eritromicina","remedio","analgesico","paracetamol"]},{"nome":"Chocolate","gravidade":"grave","obs":"Por precaução, nunca ofereça. A teobromina é tóxica para pequenos animais.","apelidos":["cacau","brigadeiro","bombom","achocolatado","chocolate"]},{"nome":"Grãos, sementes e amendoim","gravidade":"moderada","obs":"São muito gordurosos para a digestão delicada. A ração deve vir sem grãos à vista.","apelidos":["milho","ervilha","amendoim","girassol","semente","graos","castanha","nozes","noz"]},{"nome":"Açúcar e doces","gravidade":"moderada","obs":"Bagunçam o intestino e engordam.","apelidos":["acucar","doce","bala","bolo","biscoito","mel","sorvete"]},{"nome":"Cebola e alho","gravidade":"moderada","obs":"Por precaução, evite.","apelidos":["cebola","alho","cebolinha"]},{"nome":"Abacate","gravidade":"moderada","obs":"A persina é tóxica para muitos animais. Por precaução, evite.","apelidos":["avocado","guacamole"]},{"nome":"Madeiras e plantas sem procedência","gravidade":"moderada","obs":"Algumas madeiras e plantas são tóxicas. Use só itens próprios para roedores.","apelidos":["madeira","planta","galho","folha","cedro","pinus"]},{"nome":"Frutas e verduras frescas em excesso","gravidade":"leve","obs":"Podem causar diarreia e gases. Só pedacinhos e raramente.","apelidos":["fruta","banana","maca","uva","verdura","alface","legume","cenoura","couve","tomate"]},{"nome":"Leite e laticínios","gravidade":"leve","obs":"Não são adequados para a digestão da chinchila.","apelidos":["leite","queijo","iogurte","laticinio"]}],"alertas":["Parar de comer ou de fazer cocô por mais de 12 horas: é urgência","Barriga inchada e dura","Moleza, respiração rápida, baba ou orelhas muito vermelhas e quentes: pode ser golpe de calor. Leve para um lugar fresco e procure o veterinário na hora","Baba, queixo molhado ou dificuldade de mastigar (problema nos dentes)","Olho vermelho ou com secreção","Diarreia ou perda de pelo em falhas","Respiração difícil"],"vacinas":{"modo":"nenhuma","nota":"Chinchilas de estimação não precisam de vacinas de rotina. Faça uma consulta com veterinário que conheça a espécie logo depois de adotar e outra por ano. Use esta aba para registrar consultas, exames e tratamentos."}},{"id":"porquinho","nome":"Porquinho-da-índia","emoji":"🐷","pet":[],"palavras":["porquinho","cobaia","guinea","prea","preá"],"status":"rascunho","vacinas":{"modo":"nenhuma","nota":"Porquinhos-da-índia não costumam precisar de vacinas ou vermífugos de rotina. Use esta aba para consultas, exames e tratamentos que o veterinário indicar."},"resumo":"Roedor dócil e sociável, que não produz a própria vitamina C e vive melhor acompanhado.","secoes":[{"titulo":"Vida e porte","itens":["Vive de 5 a 8 anos com bons cuidados.","Na fase adulta, o macho pesa em torno de 1 kg e a fêmea, entre 800 e 900 g."]},{"titulo":"Alimentação","itens":["Feno de capim, como o de timóteo, deve ficar disponível o dia todo. Ele é a maior parte da dieta, cerca de 60 a 80%.","Ofereça ração própria para porquinho-da-índia, em porção medida, de preferência com vitamina C. Ração de coelho não serve, porque falta vitamina C.","O porquinho não produz vitamina C. Sem ela, pode ter escorbuto. Ofereça alimentos ricos em vitamina C, como pimentão vermelho, e converse com o veterinário sobre suplemento.","As fontes divergem sobre alguns legumes e frutas. Peça ao veterinário a lista adequada e apresente novidades aos poucos e em pouca quantidade.","Ele é herbívoro: nada de carne, leite ou ovos.","Água fresca todos os dias."]},{"titulo":"Saúde","itens":["Porquinhos-da-índia não costumam precisar de vacinas ou vermífugos de rotina.","Procure um veterinário de animais silvestres e exóticos.","Os dentes crescem a vida toda. Feno todos os dias ajuda no desgaste.","Se o porquinho para de se limpar, algo está errado e ele precisa de consulta."]},{"titulo":"Ambiente e rotina","itens":["Ofereça espaço amplo. O mínimo recomendado é cerca de 80 por 90 cm para um porquinho.","Vivem melhor com a companhia de outro porquinho. Para não ter filhotes, junte animais do mesmo sexo.","Têm pouca noção de altura e não são bons escaladores. Evite lugares altos, para evitar quedas.","Esconderijos e túneis dão segurança. Ele é mais ativo ao amanhecer e ao fim da tarde.","Banho só quando for estritamente necessário.","Aproxime-se de frente e em nível baixo. Evite pegar pelo alto, como um predador faria."]},{"titulo":"Reprodução","itens":["A gestação dura cerca de 59 a 72 dias, em média 62.","Converse com um veterinário de exóticos antes de reproduzir."]},{"titulo":"Curiosidades","itens":["O nome engana: não é porco nem vem da Índia. Ele é da América do Sul."]}],"toxicos":[{"nome":"Chocolate","gravidade":"grave","obs":"Por precaução, nunca ofereça. A teobromina é tóxica para pequenos animais.","apelidos":["cacau","brigadeiro","bombom","achocolatado","chocolate"]},{"nome":"Ração de coelho","gravidade":"moderada","obs":"Não tem vitamina C suficiente e a composição não serve para o porquinho.","apelidos":["racao de coelho","racao coelho"]},{"nome":"Cebola, alho e cebolinha","gravidade":"moderada","obs":"Por precaução, evite. Podem causar anemia.","apelidos":["cebola","alho","cebolinha"]},{"nome":"Carne, ovos, leite e queijo","gravidade":"moderada","obs":"O porquinho é herbívoro e não digere bem alimentos de origem animal.","apelidos":["carne","ovo","leite","queijo","iogurte","frango"]},{"nome":"Batata, feijão e couve-flor","gravidade":"moderada","obs":"Algumas fontes citam como proibidos. Por precaução, evite.","apelidos":["batata","feijao","couve flor","couve-flor"]},{"nome":"Açúcar, doces e salgadinhos","gravidade":"moderada","obs":"Engordam e bagunçam o intestino.","apelidos":["acucar","doce","bala","bolo","biscoito","salgadinho","pao"]},{"nome":"Abacate","gravidade":"moderada","obs":"Por precaução, evite.","apelidos":["avocado","guacamole"]},{"nome":"Frutas e verduras em excesso","gravidade":"leve","obs":"Podem causar diarreia. Ofereça pouca quantidade e novidades aos poucos.","apelidos":["fruta","verdura","legume","alface","cenoura","maca","banana","uva"]}],"alertas":["Parar de comer ou de beber por mais de 12 horas","Dificuldade para andar, dor ao ser tocado ou apatia: pode ser falta de vitamina C","Diarreia","Baba ou dificuldade para mastigar","Espirros com secreção ou respiração difícil","Queda de lugar alto"]},{"id":"furao","nome":"Furão","emoji":"🐾","pet":[],"palavras":["furao","furão","ferret"],"status":"rascunho","vacinas":{"modo":"rotina","nota":"Furões costumam receber a vacina antirrábica e a vacina contra cinomose, com reforço anual. Confirme o protocolo com um veterinário de animais exóticos."},"resumo":"Pequeno predador doméstico: ativo, curioso e de saúde delicada. Exige vacinas, ração própria e veterinário de exóticos.","secoes":[{"titulo":"Vida e porte","itens":["Em média vive de 5 a 10 anos. Como animal de estimação, costuma ficar entre 7 e 8 anos.","Rotina estressante e muito tempo preso na gaiola diminuem a expectativa de vida."]},{"titulo":"Alimentação","itens":["O furão é carnívoro. Precisa de ração própria para furões, rica em proteína animal. Peça orientação ao veterinário antes de usar outra ração.","Não ofereça frutas, verduras, açúcar ou laticínios. O intestino dele não digere bem esses alimentos.","Água fresca sempre."]},{"titulo":"Saúde e vacinas","itens":["Furões devem receber a vacina antirrábica e a vacina contra cinomose, com reforço anual.","Cinomose, raiva e a doença de Aleuta são problemas que reduzem a expectativa de vida.","A saúde do furão é frágil. Faça consultas regulares com um veterinário de animais exóticos e confirme o calendário com ele."]},{"titulo":"Ambiente e rotina","itens":["Gaiola grande, com vários andares, esconderijos e um lugar macio para dormir.","Fora da gaiola, só com supervisão e num ambiente preparado para furão. Ele entra em qualquer fresta.","Furões precisam de brincadeira todos os dias. Retire borrachas, espumas e plásticos que ele possa roer e engolir.","São sensíveis ao calor. Mantenha em local fresco e ventilado.","Passam muitas horas dormindo. Respeite o sono dele."]},{"titulo":"Reprodução","itens":["A gestação dura cerca de 45 dias.","Podem ter até duas ninhadas por ano, de 4 a 9 filhotes.","Converse com um veterinário de exóticos antes de reproduzir."]},{"titulo":"Legislação","itens":["No Brasil, o furão é considerado animal exótico. A importação e a posse dependem de autorização do Ibama.","Compre só de criador registrado e guarde a documentação de origem.","Confirme as regras atuais no Ibama e no órgão ambiental do seu estado."]}],"toxicos":[{"nome":"Chocolate","gravidade":"grave","obs":"A teobromina é tóxica. Evite totalmente.","apelidos":["cacau","brigadeiro","bombom","achocolatado","chocolate"]},{"nome":"Cebola, alho e cebolinha","gravidade":"grave","obs":"Podem destruir os glóbulos vermelhos e causar anemia.","apelidos":["cebola","alho","cebolinha"]},{"nome":"Café e cafeína","gravidade":"grave","obs":"A cafeína causa agitação e problemas no coração.","apelidos":["cafe","cafeina","energetico","cha preto","refrigerante de cola","guarana"]},{"nome":"Álcool","gravidade":"grave","obs":"Mesmo pouca quantidade pode intoxicar.","apelidos":["cerveja","vinho","cachaca","bebida alcoolica","vodka"]},{"nome":"Xilitol","gravidade":"grave","obs":"Adoçante em gomas, balas e produtos sem açúcar. Evite totalmente.","apelidos":["adocante","goma de mascar","chiclete","bala sem acucar"]},{"nome":"Remédios de uso humano","gravidade":"grave","obs":"Podem ser fatais. Nunca medique sem orientação do veterinário.","apelidos":["paracetamol","ibuprofeno","dipirona","remedio","analgesico","antibiotico"]},{"nome":"Borracha, espuma e plástico","gravidade":"grave","obs":"Não é comida, mas furões roem e engolem. Isso pode causar obstrução no intestino e exige cirurgia.","apelidos":["borracha","espuma","plastico","brinquedo","meia","tapete"],"naoComida":true},{"nome":"Uvas e passas","gravidade":"moderada","obs":"Por precaução, evite.","apelidos":["uva","passa","uva passa"]},{"nome":"Açúcar e doces","gravidade":"moderada","obs":"Furões não devem comer açúcar. Pode causar problemas de saúde.","apelidos":["acucar","doce","bala","bolo","biscoito","mel","sorvete"]},{"nome":"Frutas e verduras","gravidade":"leve","obs":"O furão é carnívoro e não digere bem vegetais.","apelidos":["fruta","verdura","legume","banana","maca","alface","cenoura","melancia"]},{"nome":"Leite e laticínios","gravidade":"leve","obs":"Furões não digerem bem a lactose.","apelidos":["leite","queijo","iogurte","laticinio","sorvete"]}],"alertas":["Apatia, vômito ou recusa de comida","Barriga dura, ou tentar vomitar sem sucesso: pode ser obstrução por borracha ou espuma, é urgência","Febre, secreção nos olhos ou no nariz, tosse ou diarreia: podem ser sinais de cinomose","Convulsão ou desmaio","Respiração ofegante e moleza no calor"]},{"id":"jabuti","nome":"Jabuti","emoji":"🐢","pet":[],"palavras":["jabuti"],"status":"rascunho","vacinas":{"modo":"nenhuma","nota":"Jabutis não precisam de vacinas de rotina. Use esta aba para consultas com veterinário de répteis, exames e tratamentos indicados."},"resumo":"Réptil terrestre de vida muito longa. Precisa de calor, sol e cálcio, e só pode ser criado de forma legal.","secoes":[{"titulo":"Vida e porte","itens":["Pode viver de 50 a 80 anos ou mais. É um compromisso para a vida toda e, muitas vezes, passa de geração em geração.","Os adultos pesam de 6 a 12 kg. O jabuti-piranga chega a cerca de 50 cm, e o jabuti-tinga, a cerca de 70 cm."]},{"titulo":"Alimentação","itens":["São predominantemente herbívoros. A maior parte da dieta deve ser de folhas, verduras e legumes.","Frutas e proteína animal entram em pequena quantidade. As fontes divergem nas proporções, então peça orientação a um veterinário de répteis.","A alimentação precisa ser rica em cálcio. O corpo só aproveita o cálcio com vitamina D, que vem do sol.","Excesso de mamão e de alface causa diarreia.","Existe ração própria para jabutis, que ajuda a equilibrar a dieta.","Água fresca em pote raso."]},{"titulo":"Saúde","itens":["Jabutis não precisam de vacinas de rotina.","Procure um veterinário de répteis. O filhote deve sair do criadouro com microchip, comendo bem e já desvermifugado.","Alimentação ruim e pouco sol causam avitaminose, raquitismo e problemas nos olhos."]},{"titulo":"Ambiente e rotina","itens":["O recinto precisa de calor: de dia, de 26 a 30 °C, e de noite, de 22 a 26 °C. Deixe áreas mais quentes e mais frias para ele escolher.","Ele precisa de sol direto por pelo menos uma hora por dia.","O jabuti é terrestre e não nada. Ofereça só um pote raso de água.","Filhote e adulto precisam de recintos diferentes.","Use termômetro no recinto. Frio demais deixa o metabolismo lento, e ele para de comer."]},{"titulo":"Legislação","itens":["Pelo Ibama, só o jabuti-tinga e o jabuti-piranga podem ser criados em casa, e apenas quando vêm de criadouro autorizado.","Na compra, exija nota fiscal, certificado de origem e microchip.","Comprar sem documentação alimenta o contrabando e é crime.","As regras estaduais podem variar. Confirme no Ibama e no órgão ambiental do seu estado."]}],"toxicos":[{"nome":"Frio abaixo de 22 °C","gravidade":"moderada","obs":"Não é comida, mas o frio deixa o metabolismo lento, e o jabuti para de comer. Mantenha o recinto aquecido e confira a temperatura.","apelidos":["frio","friagem","inverno","temperatura","geladeira"],"naoComida":true},{"nome":"Falta de sol e de cálcio","gravidade":"moderada","obs":"Não é comida. Sem sol e sem cálcio, o casco e os ossos ficam fracos (raquitismo).","apelidos":["sol","calcio","uv","vitamina d","casco mole"],"naoComida":true},{"nome":"Chocolate","gravidade":"grave","obs":"Por precaução, nunca ofereça.","apelidos":["cacau","brigadeiro","bombom","achocolatado","chocolate"]},{"nome":"Ração de cão e de gato, e carne em excesso","gravidade":"moderada","obs":"Proteína demais faz mal ao jabuti. A proteína animal deve ser ocasional e em pouca quantidade.","apelidos":["racao de cachorro","racao de gato","carne","frango","ovo","racao"]},{"nome":"Leite, queijo, pão e comida humana","gravidade":"moderada","obs":"Não são adequados para o jabuti.","apelidos":["leite","queijo","pao","macarrao","arroz","bolo","biscoito","doce","acucar","salgadinho"]},{"nome":"Cebola e alho","gravidade":"moderada","obs":"Por precaução, evite.","apelidos":["cebola","alho","cebolinha"]},{"nome":"Plantas ornamentais desconhecidas","gravidade":"moderada","obs":"Várias plantas de jardim são tóxicas. Ofereça só folhas que você sabe que são seguras.","apelidos":["planta","folha","flor","jardim","grama"]},{"nome":"Mamão e alface em excesso","gravidade":"leve","obs":"Causam diarreia quando são a base da dieta.","apelidos":["mamao","alface"]}],"alertas":["Parar de comer por vários dias, principalmente no frio","Olhos inchados ou fechados","Casco mole, deformado ou com rachaduras","Secreção ou bolhas no nariz, ou respirar de boca aberta","Diarreia que não passa","Moleza e ficar escondido por muitos dias"]},{"id":"coelho","nome":"Coelho","emoji":"🐰","pet":["coelho"],"palavras":[],"status":"rascunho","resumo":"Herbívoro sensível, que depende de feno o tempo todo e de um ambiente fresco e seguro.","secoes":[{"titulo":"Vida e porte","itens":["Costuma viver cerca de 8 a 10 anos, podendo passar disso com bons cuidados.","O peso adulto vai de 1 a mais de 5 kg, conforme a raça. Combine a faixa ideal com o veterinário."]},{"titulo":"Alimentação","itens":["O feno de capim deve ser cerca de 70% da dieta e ficar sempre disponível.","Ofereça folhas verdes escuras frescas todo dia, ração em pellets em pouca quantidade e frutas e cenoura só como petisco.","Mude a alimentação aos poucos.","Coelhos não vomitam. Problemas digestivos são sérios e pedem veterinário rápido.","Água fresca sempre, em bebedouro ou pote pesado."]},{"titulo":"Saúde e vacinas","itens":["Converse com o veterinário sobre vacinas e prevenção. As opções variam por região.","Alguns antibióticos comuns, como a amoxicilina por via oral, são perigosos para coelhos. Nunca medique sem um veterinário de animais exóticos.","Os dentes crescem a vida toda, e o feno ajuda no desgaste."]},{"titulo":"Ambiente e rotina","itens":["Precisa de espaço amplo para pular. Não deve ficar preso o tempo todo.","O calor forte é perigoso. Mantenha em local fresco, ventilado e à sombra.","Coelhos roem tudo. Proteja fios elétricos e plantas."]},{"titulo":"Reprodução","itens":["A gestação dura cerca de 29 a 35 dias.","A fêmea pode engravidar de novo logo após o parto.","Converse com o veterinário sobre castração."]}],"toxicos":[{"nome":"Chocolate","gravidade":"grave","obs":"A teobromina é tóxica para coelhos. Evite totalmente.","apelidos":["cacau","brigadeiro","bombom","achocolatado","chocolate"]},{"nome":"Abacate","gravidade":"grave","obs":"Contém persina, tóxica para coelhos. Vale para toda a planta.","apelidos":["avocado","guacamole"]},{"nome":"Remédios com amoxicilina e penicilinas","gravidade":"grave","obs":"Antibióticos por via oral podem ser perigosos para coelhos. Só use com orientação de veterinário de exóticos.","apelidos":["amoxicilina","penicilina","antibiotico","remedio"]},{"nome":"Cebola, alho e cebolinha","gravidade":"moderada","obs":"Algumas fontes indicam toxicidade e outras não. Por precaução, evite.","apelidos":["cebola","alho","cebolinha","alho-poro"]},{"nome":"Uvas e passas","gravidade":"moderada","obs":"Podem causar problemas nos rins. Por precaução, evite.","apelidos":["uva","passa","uva passa"]},{"nome":"Ruibarbo","gravidade":"moderada","obs":"O ácido oxálico atrapalha a absorção de cálcio.","apelidos":["ruibarbo"]},{"nome":"Açúcar e alimentos processados","gravidade":"moderada","obs":"Biscoitos, iogurtes e doces desequilibram o intestino e podem causar doenças graves.","apel   ];
  const listaParceiros = () => DEMO ? EXEMPLOS : PARCEIROS;

  /* ---------- BIBLIOTECA ----------
     O conteúdo vem do arquivo biblioteca.json do site. Se ele não existir, usa a cópia embutida (BIB_PADRAO).
     Para acrescentar uma espécie ou um alimento, edite o biblioteca.json e aumente o número de "versao". */
  let BIB = BIB_PADRAO;
  let bibEsp;            // undefined = escolher pela espécie do pet
  let tabAntes = 'inicio';
  const GRAV = { grave: ['Perigo grave', 'bad', 0], moderada: ['Perigo moderado', 'warn', 1], leve: ['Evite', 'neutro', 2] };
  const ESPECIES = [['cao','Cachorro'],['gato','Gato'],['ave','Ave'],['roedor','Roedor'],['coelho','Coelho'],['reptil','Réptil'],['peixe','Peixe'],['outro','Outro']];
  const TIPOS_VAC = [['vacina','Vacina'],['vermifugo','Vermífugo'],['antipulgas','Antipulgas'],['consulta','Consulta ou retorno'],['exame','Exame'],['tratamento','Remédio ou tratamento'],['outro','Outro']];
  const CATEG = [['racao','Ração'],['consulta','Consulta'],['vacina','Vacina'],['exame','Exame'],['medicamento','Remédio'],['banho_tosa','Banho e tosa'],['hospedagem','Hospedagem'],['treinamento','Treino'],['acessorio','Acessórios'],['outro','Outros']];
  const TABS = [['inicio','Início'],['saude','Saúde'],['comida','Comida'],['peso','Peso'],['gastos','Gastos'],['mais','Mais']];

  /* Ícones: hoje são emojis. Quando tiver ícones 3D, coloque o arquivo em assets/icones/
     e escreva o caminho aqui, por exemplo:  saude: 'assets/icones/saude.png'  */
  const EMOJI = { inicio:'🏠', saude:'💉', comida:'🍖', peso:'⚖️', gastos:'💰', mais:'✨', vermifugo:'💊', antipulgas:'🐜', vacina:'💉', consulta:'🩺', exame:'🔬', tratamento:'💊', outro:'📌' };
  const PNG = ICONES;
  const icone = k => PNG[k] ? `<img class="ico" src="${PNG[k]}" alt="">` : (EMOJI[k] || '');

  /* ---------- utilidades ---------- */
  const $ = (s, r = document) => r.querySelector(s);
  const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[c]));
  const pad = n => String(n).padStart(2, '0');
  const iso = d => d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate());
  const hoje = () => iso(new Date());
  const pd = s => { const [y, m, d] = s.split('-').map(Number); return new Date(y, m - 1, d); };
  const dias = (a, b) => Math.round((pd(b) - pd(a)) / 86400000);
  const addDias = (s, n) => { const d = pd(s); d.setDate(d.getDate() + n); return iso(d); };
  const fmtData = s => s ? pd(s).toLocaleDateString('pt-BR') : '';
  const brl = n => Number(n || 0).toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' });
  const kg = n => Number(n).toLocaleString('pt-BR', { maximumFractionDigits: 2 }) + ' kg';
  const gr = n => Number(n).toLocaleString('pt-BR', { maximumFractionDigits: 0 }) + ' g';
  const num = v => { const n = parseFloat(String(v == null ? '' : v).replace(',', '.')); return isFinite(n) ? n : null; };
  const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
  const rotulo = (lista, k) => (lista.find(x => x[0] === k) || [k, k])[1];
  const plural = (n, a, b) => n === 1 ? a : b;

  /* ---------- dados ---------- */
  const vazio = () => ({ pets: [], ativo: null, vacinas: [], planos: {}, refeicoes: [], pesos: [], gastos: [], streak: { dias: 0, ultimo: null } });
  function semear() {
    const d = vazio(), h = hoje(), id = 'demo-thor';
    d.pets.push({ id, nome: 'Thor', especie: 'cao', raca: 'Golden Retriever', sexo: 'macho', nasc: addDias(h, -800), foto: null });
    d.ativo = id;
    d.vacinas.push(
      { id: uid(), petId: id, tipo: 'vermifugo', nome: 'Vermífugo', aplicada: addDias(h, -85), proxima: addDias(h, 5) },
      { id: uid(), petId: id, tipo: 'vacina', nome: 'V10', aplicada: addDias(h, -245), proxima: addDias(h, 120) },
      { id: uid(), petId: id, tipo: 'vacina', nome: 'Antirrábica', aplicada: addDias(h, -200), proxima: addDias(h, 165) });
    d.planos[id] = { produto: 'Ração adulto', marca: 'Premium', dose: 300, refeicoes: 2, pacote: 10000, preco: 189.9, aberto: addDias(h, -28) };
    [[-84, 28.4], [-56, 29.1], [-28, 29.8], [-3, 30.2]].forEach(([n, k]) => d.pesos.push({ id: uid(), petId: id, data: addDias(h, n), kg: k }));
    d.gastos.push({ id: uid(), petId: id, cat: 'racao', valor: 189.9, data: h, desc: 'Ração adulto' },
                  { id: uid(), petId: id, cat: 'consulta', valor: 220, data: h, desc: 'Check-up' });
    d.refeicoes.push({ id: uid(), petId: id, data: h, hora: '08:10', g: 150 });
    d.streak = { dias: 6, ultimo: h };
    return d;
  }
  function carregar() {
    try {
      const d = Object.assign(vazio(), JSON.parse(localStorage.getItem(KEY)) || {});
      return DEMO && !d.pets.length ? semear() : d;
    } catch (e) { return DEMO ? semear() : vazio(); }
  }
  let S = carregar();
  function salvar() {
    try { localStorage.setItem(KEY, JSON.stringify(S)); }
    catch (e) { aviso('Não deu para salvar. O armazenamento do aparelho pode estar cheio.'); }
  }
  const petAtivo = () => S.pets.find(p => p.id === S.ativo) || S.pets[0] || null;

  let tab = 'inicio';
  let mes = hoje().slice(0, 7);

  /* ---------- regras ---------- */
  function idade(nasc) {
    if (!nasc) return '';
    const d = dias(nasc, hoje());
    if (d < 0) return '';
    const m = Math.floor(d / 30.44);
    if (m < 1) return d + plural(d, ' dia', ' dias');
    if (m < 24) return m + plural(m, ' mês', ' meses');
    return Math.floor(m / 12) + ' anos';
  }
  function statusVac(v) {
    if (!v.proxima) return { cls: 'neutro', txt: 'Sem próxima', ordem: 9999, d: null };
    const d = dias(hoje(), v.proxima);
    if (d < 0) return { cls: 'bad', txt: 'Atrasada ' + (-d) + 'd', ordem: d, d };
    if (d === 0) return { cls: 'warn', txt: 'É hoje', ordem: 0, d };
    if (d <= 30) return { cls: 'warn', txt: 'Em ' + d + 'd', ordem: d, d };
    return { cls: 'ok', txt: 'Em dia', ordem: d, d };
  }
  const vacinasDo = p => S.vacinas.filter(v => v.petId === p.id).sort((a, b) => statusVac(a).ordem - statusVac(b).ordem);
  const planoDo = p => S.planos[p.id] || null;
  function infoPacote(pl) {
    if (!pl || !pl.pacote || !pl.dose) return null;
    const dur = Math.floor(pl.pacote / pl.dose);
    if (dur < 1) return null;
    const aberto = pl.aberto || hoje();
    const usados = Math.max(0, dias(aberto, hoje()));
    return { dur, aberto, resta: dur - usados, acaba: addDias(aberto, dur), pct: Math.min(100, usados / dur * 100) };
  }
  const pesosDo = p => S.pesos.filter(x => x.petId === p.id).sort((a, b) => a.data < b.data ? -1 : a.data > b.data ? 1 : 0);
  const gastosDo = p => S.gastos.filter(g => g.petId === p.id);
  const refeicoesDo = p => S.refeicoes.filter(r => r.petId === p.id).sort((a, b) => (b.data + b.hora).localeCompare(a.data + a.hora));
  function tocou() {
    const h = hoje(), s = S.streak;
    if (s.ultimo === h) return;
    const o = new Date(); o.setDate(o.getDate() - 1);
    s.dias = s.ultimo === iso(o) ? s.dias + 1 : 1;
    s.ultimo = h;
  }
  function streakAtual() {
    const s = S.streak; if (!s.ultimo) return 0;
    const d = dias(s.ultimo, hoje());
    return d <= 1 ? s.dias : 0;
  }

  /* ---------- feedback ---------- */
  let tt;
  function aviso(msg, ms) {
    const t = $('#toast'); t.textContent = msg; t.classList.add('on');
    clearTimeout(tt); tt = setTimeout(() => t.classList.remove('on'), ms || 2600);
  }
  function festa() {
    if (window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches) return;
    const cores = ['#14C8C0', '#FF9A4D', '#FF7FB0', '#FFC92F', '#7B6CF6'];
    for (let i = 0; i < 22; i++) {
      const e = document.createElement('i'); e.className = 'confete';
      e.style.setProperty('--x', (Math.random() * 100) + 'vw');
      e.style.setProperty('--dx', (Math.random() * 160 - 80) + 'px');
      e.style.setProperty('--r', (Math.random() * 720 - 360) + 'deg');
      e.style.setProperty('--d', (1.1 + Math.random() * .9) + 's');
      e.style.background = cores[i % 5];
      document.body.appendChild(e); setTimeout(() => e.remove(), 2300);
    }
  }

  /* ---------- telas ---------- */
  const avatar = p => p.foto || IMG.babi;

  function topo() {
    return `<header class="topo"><img src="${IMG.icone}" alt=""><b>Baby Pet</b></header>
    <div class="pets">${S.pets.map(p => `<button class="chip ${p.id === petAtivo().id ? 'on' : ''}" data-act="${p.id === petAtivo().id ? 'editpet' : 'pet'}:${p.id}" ${p.id === petAtivo().id ? 'title="Toque para editar"' : ''}><img src="${esc(avatar(p))}" alt="">${esc(p.nome)}</button>`).join('')}
      <button class="chip add" data-act="addpet">+ Pet</button></div>`;
  }

  function telaBoasVindas() {
    return `<section class="boas"><img src="${IMG.cuidadora}" alt="Baby, a cuidadora do app">
      <h1>Oi! Eu sou a Baby</h1>
      <p>Vou te ajudar a cuidar do seu pet: vacinas, ração, peso e gastos num lugar só.</p>
      <button class="btn" data-act="addpet">Cadastrar meu pet</button></section>`;
  }

  function mensagemBabi(p) {
    const vs = vacinasDo(p), atras = vs.filter(v => statusVac(v).d !== null && statusVac(v).d < 0);
    if (atras.length) return `<b>Atenção!</b>${esc(p.nome)} tem ${atras.length} ${plural(atras.length, 'item de saúde atrasado', 'itens de saúde atrasados')}.`;
    const prox = vs.find(v => { const d = statusVac(v).d; return d !== null && d >= 0 && d <= 7; });
    if (prox) return `<b>Já já!</b>${esc(prox.nome)} do ${esc(p.nome)} vence em ${statusVac(prox).d} ${plural(statusVac(prox).d, 'dia', 'dias')}.`;
    const ip = infoPacote(planoDo(p));
    if (ip && ip.resta <= 7) return `<b>Hora de comprar!</b>A ração do ${esc(p.nome)} acaba em cerca de ${Math.max(ip.resta, 0)} ${plural(ip.resta, 'dia', 'dias')}.`;
    if (!vs.length) return modoVac(p) === 'rotina' ? `<b>Vamos começar?</b>Cadastre a primeira vacina do ${esc(p.nome)}.` : `<b>Vamos começar?</b>Registre a primeira consulta ou anotação de saúde do ${esc(p.nome)}.`;
    return `<b>Tudo certo!</b>${esc(p.nome)} está com tudo em dia. Bom trabalho, tutor!`;
  }

  const norm = s => String(s == null ? '' : s).normalize('NFD').replace(/[\u0300-\u036f]/g, '').toLowerCase().trim();
  const bibPorId = id => BIB.especies.find(e => e.id === id) || null;
  function bibDoPet(p) {
    if (!p) return null;
    const r = norm(p.raca);
    if (r) { const por = BIB.especies.find(e => (e.palavras || []).some(w => r.includes(norm(w)))); if (por) return por; }
    return BIB.especies.find(e => (e.pet || []).includes(p.especie)) || null;
  }
  /* Como falar de vacinas para este pet:
     rotina = há calendário de vacinas; consultar = depende do veterinário e da região;
     nenhuma = não há vacina de rotina; desconhecido = espécie sem guia no app. */
  function modoVac(p) {
    const e = bibDoPet(p);
    if (e && e.vacinas && e.vacinas.modo) return e.vacinas.modo;
    if (p && (p.especie === 'cao' || p.especie === 'gato')) return 'rotina';
    return 'desconhecido';
  }
  function notaVac(p) {
    const e = bibDoPet(p), m = modoVac(p);
    if (e && e.vacinas && e.vacinas.nota) return e.vacinas.nota;
    if (m === 'rotina') return 'O calendário exato é definido pelo veterinário.';
    return 'Vacinas e vermífugos variam muito de uma espécie para outra, e aplicar o que não é indicado pode fazer mal. Converse com um veterinário que conheça a espécie do seu pet antes de registrar ou aplicar qualquer coisa. Use esta aba para anotar consultas, exames e tratamentos indicados.';
  }
  function bibAtual(p) { return bibEsp !== undefined ? bibPorId(bibEsp) : bibDoPet(p); }

  function telaBiblioteca(p) {
    const sel = bibAtual(p);
    const chips = BIB.especies.map(e => `<button class="chip ${sel && sel.id === e.id ? 'on' : ''}" data-act="bibesp:${esc(e.id)}"><span style="font-size:26px;padding-left:6px">${e.emoji}</span>${esc(e.nome)}</button>`).join('');
    let corpo;
    if (!sel) {
      corpo = `<div class="glass card vazio"><img src="${IMG.busto}" alt=""><h3>Escolha uma espécie</h3><p>${['ave', 'roedor', 'reptil', 'outro'].includes(p.especie) ? 'Para o app achar o guia certo, escreva o tipo do animal no cadastro (por exemplo: chinchila). Ou toque numa espécie acima.' : 'Ainda não temos o guia para essa espécie. Toque numa das espécies acima.'}</p>
        ${['ave', 'roedor', 'reptil', 'outro'].includes(p.especie) ? `<button class="ghost" data-act="editpet:${esc(p.id)}">Editar o cadastro de ${esc(p.nome)}</button>` : ''}</div>`;
    } else {
      const tox = sel.toxicos.slice().sort((a, b) => (GRAV[a.gravidade] || GRAV.leve)[2] - (GRAV[b.gravidade] || GRAV.leve)[2]);
      corpo = `<section class="glass card bib-hero"><div class="bib-emoji">${sel.emoji}</div><div><h2 style="margin:0">${esc(sel.nome)}</h2><p>${esc(sel.resumo)}</p>
          <span class="tag ${sel.status === 'revisado' ? 'ok' : 'warn'}">${sel.status === 'revisado' ? 'Revisado por veterinário' : 'Em revisão veterinária'}</span></div></section>
        <section class="glass card" style="margin-top:12px"><h3>Posso dar...?</h3>
          <p class="peq">Digite um alimento para ver se ele está na lista de perigosos${sel.id ? ' para ' + esc(sel.nome.toLowerCase()) : ''}.</p>
          <label class="fld" style="margin:10px 0 10px"><span>Alimento</span><input id="bibq" type="text" placeholder="Ex.: chocolate, uva, abacate" autocomplete="off" autocapitalize="none"></label>
          <button class="btn full" data-act="bibcheck">Verificar</button><div id="bibres" aria-live="polite"></div></section>
        <section class="glass card alerta-bib" style="margin-top:12px"><h3>Procure o veterinário se houver</h3><ul>${sel.alertas.map(a => `<li>${esc(a)}</li>`).join('')}</ul></section>
        <div style="margin-top:6px">${sel.secoes.map((s, i) => `<details class="bib" ${i === 0 ? 'open' : ''}><summary>${esc(s.titulo)}</summary><ul>${s.itens.map(t => `<li>${esc(t)}</li>`).join('')}</ul></details>`).join('')}
          <details class="bib"><summary>Alimentos e itens perigosos</summary><div style="padding-bottom:6px">${tox.map(t => { const g = GRAV[t.gravidade] || GRAV.leve; return `<div class="toxi"><span class="tag ${g[1]}">${g[0]}</span><div><b>${esc(t.nome)}</b><small style="display:block">${esc(t.obs)}</small></div></div>`; }).join('')}</div></details></div>`;
    }
    return `<div style="display:flex;align-items:center;gap:10px;margin-bottom:6px"><button class="ghost" data-act="voltar" aria-label="Voltar">‹ Voltar</button></div>
      <h1 style="display:flex;align-items:center;gap:10px">${icone('biblioteca')}<span>Biblioteca</span></h1><p class="peq" style="margin:4px 0 12px">Guia de cuidados por espécie${p ? ', com o ' + esc(p.nome) + ' em mente' : ''}.</p>
      <div class="glass card aviso-bib">${esc(BIB.aviso)}</div>
      <section class="glass card" style="margin-top:12px"><h3>Procurar outro animal</h3>
        <p class="peq">Não achou o seu? Busque pelo nome, por exemplo: furão, jabuti ou porquinho-da-índia.</p>
        <label class="fld" style="margin:10px 0 10px"><span>Nome do animal</span><input id="bibbusca" type="text" placeholder="Ex.: furão" autocomplete="off" autocapitalize="none"></label>
        <button class="btn full" data-act="bibbuscar">Buscar</button><div id="bibbuscares" aria-live="polite"></div></section>
      <div class="bib-chips" style="margin-top:12px">${chips}</div>
      ${corpo}
      <details class="bib" style="margin-top:14px"><summary>Fontes e atualização</summary><ul class="fontes">${(BIB.fontes || []).map(f => `<li><a href="${esc(f.url)}" target="_blank" rel="noopener">${esc(f.nome)}</a></li>`).join('')}</ul>
        <p class="peq" style="margin:0 0 14px">${esc(BIB.nota || '')} Atualizado em ${fmtData(BIB.atualizado || hoje())}.</p></details>`;
  }

  function montarCartao(g, p) {
    if (g === 'saude') {
      const v = vacinasDo(p).find(x => { const s = statusVac(x); return s.d !== null && s.d <= 14; });
      if (!v) return null;
      const d = statusVac(v).d;
      return { titulo: 'Hora de cuidar da saúde',
        texto: v.nome + ' do ' + p.nome + ' ' + (d < 0 ? 'venceu há ' + (-d) + ' ' + plural(-d, 'dia', 'dias') + '.' : d === 0 ? 'vence hoje.' : 'vence em ' + d + ' ' + plural(d, 'dia', 'dias') + '.'),
        botao: 'Agendar agora',
        msg: 'Olá! Vi vocês no app Baby Pet. Quero agendar ' + v.nome + ' para o ' + p.nome + '.' };
    }
    const pl = planoDo(p), ip = infoPacote(pl);
    if (!ip || ip.resta > 7) return null;
    return { titulo: 'Hora de repor a ração',
      texto: ip.resta > 0 ? 'A ração do ' + p.nome + ' acaba em cerca de ' + ip.resta + ' ' + plural(ip.resta, 'dia', 'dias') + '.' : 'A ração do ' + p.nome + ' acabou.',
      botao: 'Pedir agora',
      msg: 'Olá! Vi vocês no app Baby Pet. Quero repor a ração do ' + p.nome + ': ' + pl.produto + (pl.marca ? ' ' + pl.marca : '') + (pl.pacote ? ', pacote de ' + gr(pl.pacote) : '') + '.' };
  }
  function cartaoParceiro(g, p) {
    const par = listaParceiros().find(x => x.gatilho === g); if (!par) return '';
    const c = montarCartao(g, p); if (!c) return '';
    return `<section class="glass card parceiro" aria-label="Sugestão de parceiro">
      <div class="linha"><span class="tag neutro">Patrocinado${par.exemplo ? ' · exemplo' : ''}</span><button class="porque" data-act="porque">Por que vejo isso?</button></div>
      <h3 style="margin-top:8px">${esc(c.titulo)}</h3><p>${esc(c.texto)}</p>
      <div class="par-info"><div class="par-logo">${esc(par.nome.charAt(0))}</div><div><b>${esc(par.nome)}</b><small>${esc(par.area)}</small></div></div>
      <div class="oferta">🎁 ${esc(par.oferta)}</div>
      <button class="btn full" data-act="contato:${esc(par.id)}|${g}">${esc(c.botao)}</button>
      <small style="display:block;text-align:center;margin-top:6px">Abre o WhatsApp com a mensagem pronta</small></section>`;
  }
  function bannerDemo() {
    return `<div class="demo"><span>Modo demonstração · dados de exemplo</span><button data-act="resetdemo">Reiniciar</button><button data-act="sairdemo">Sair</button></div>`;
  }

  function telaInicio(p) {
    const vs = vacinasDo(p).filter(v => v.proxima);
    const prox = vs[0];
    const ip = infoPacote(planoDo(p));
    const ps = pesosDo(p), ultimo = ps[ps.length - 1];
    const gm = gastosDo(p).filter(g => g.data.slice(0, 7) === hoje().slice(0, 7)).reduce((t, g) => t + g.valor, 0);
    const st = streakAtual();
    return `<section class="hero glass"><img src="${IMG.busto}" alt="Baby"><div class="bolha">${mensagemBabi(p)}</div></section>
    ${cartaoParceiro('saude', p) || cartaoParceiro('racao', p)}
    <div class="grid2">
      <button class="tile t-pk" data-act="tab:saude"><span class="t">${icone('saude')} Saúde</span>
        <span class="v">${prox ? (statusVac(prox).d < 0 ? 'Atrasada' : statusVac(prox).d === 0 ? 'Hoje' : 'em ' + statusVac(prox).d + ' d') : '—'}</span>
        <span class="s">${prox ? esc(prox.nome) : 'Nada marcado'}</span></button>
      <button class="tile t-or" data-act="tab:comida"><span class="t">${icone('comida')} Ração</span>
        <span class="v">${ip ? (ip.resta > 0 ? '~' + ip.resta + ' d' : 'Acabou') : '—'}</span>
        <span class="s">${ip ? 'até acabar o pacote' : 'Configure o plano'}</span></button>
      <button class="tile t-yl" data-act="tab:peso"><span class="t">${icone('peso')} Peso</span>
        <span class="v">${ultimo ? kg(ultimo.kg) : '—'}</span>
        <span class="s">${ultimo ? 'em ' + fmtData(ultimo.data) : 'Sem pesagem ainda'}</span></button>
      <button class="tile t-pp" data-act="tab:gastos"><span class="t">${icone('gastos')} Gastos</span>
        <span class="v ${brl(gm).length > 9 ? 'longo' : ''}">${brl(gm)}</span><span class="s">neste mês</span></button>
    </div>
    <div class="glass streak"><span class="n">${st}</span><div><b>${plural(st, 'dia', 'dias')} cuidando</b><small>${S.streak.ultimo === hoje() ? 'Hoje já tem registro. Parabéns!' : st ? 'Registre algo hoje para manter a sequência.' : 'Registre algo hoje para começar.'}</small></div></div>
    <button class="item" style="margin-top:12px" data-act="tab:biblioteca"><div class="ic">${icone('biblioteca')}</div><div class="tx"><b>${bibDoPet(p) ? 'Guia do ' + esc(bibDoPet(p).nome.toLowerCase()) : 'Biblioteca de espécies'}</b><small>Cuidados, alimentos perigosos e "Posso dar...?"</small></div><span class="dir">›</span></button>
